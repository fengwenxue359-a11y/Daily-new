name: 生成每日双语简报

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v3
    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: 安装依赖库
      run: |
        pip install feedparser deep-translator
    - name: 运行抓取和翻译脚本
      run: python generate_brief.py
    - name: 将生成的简报提交回仓库
      run: |
        git config --local user.email "bot@github.com"
        git config --local user.name "bot"
        git add briefs/
        git commit -m "更新今日简报 $(date +'%Y-%m-%d')" || exit 0
        git push
